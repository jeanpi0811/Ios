version: "3.9"
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cleanos
      POSTGRES_PASSWORD: cleanos
      POSTGRES_DB: cleanos_pro
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  db_data:
